# Save as .github/workflows/trophy.yml in manimtirkey2000/manimtirkey2000
#
# Renders your trophies to trophy.svg inside this repo and commits it.
# No external service is hit when your profile loads.
#
# Note: the action is published on a feature branch upstream (that's the ref
# ryo-ma's README documents). If it ever disappears, fall back to running
# render_svg.ts directly with Deno — same output.

name: Trophy

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --staged --quiet || git commit -m "chore: update trophy"
          git push
