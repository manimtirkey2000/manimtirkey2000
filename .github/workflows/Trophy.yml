# Save as .github/workflows/trophy.yml in manimtirkey2000/manimtirkey2000
#
# BEFORE RUNNING — create the token:
#   1. GitHub Settings -> Developer settings -> Personal access tokens
#      -> Tokens (classic) -> Generate new token (classic)
#   2. Scopes: read:user  and  public_repo
#      (no expiry, or you'll have to redo this)
#   3. Copy it, then in THIS repo: Settings -> Secrets and variables
#      -> Actions -> New repository secret
#      Name: TROPHY_TOKEN     Value: <the token>
#
# The default GITHUB_TOKEN does NOT work here — it's scoped to the repo, and
# the trophy renderer runs a GraphQL query against your *user* account. That's
# the "Error fetching user info" line in your run.

name: Trophy

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.TROPHY_TOKEN }}
          file: trophy.svg
          theme: default
          max-cols: 6
          max-rows: 1
          margin-width: 15
          margin-height: 15
          no-background: true
          no-frame: true

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trophy.svg
          git diff --staged --quiet || git commit -m "chore: update trophy"
          git push
